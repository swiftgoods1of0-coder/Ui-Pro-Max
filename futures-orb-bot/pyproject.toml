[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-orb-bot"
version = "0.1.0"
description = "New-York-session opening-range breakout / liquidity-sweep backtesting framework for futures (research only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4"]

[project.scripts]
orb-backtest = "orb_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
