  <circle cx="280" cy="343" r="2"/>
  <circle cx="360" cy="343" r="2"/>
  <circle cx="440" cy="343" r="2"/>
  <circle cx="520" cy="343" r="2"/>
  <circle cx="600" cy="343" r="2"/>
  <circle cx="680" cy="343" r="2"/>
