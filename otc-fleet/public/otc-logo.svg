<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <!-- Diamond plate pattern -->
    <pattern id="diamondPlate" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#6b7280"/>
      <path d="M0 4 L4 0 L8 4 L4 8 Z" fill="#9ca3af" opacity="0.6"/>
      <path d="M0 4 L4 0 L8 4 L4 8 Z" fill="none" stroke="#4b5563" stroke-width="0.5"/>
    </pattern>
    <!-- Metallic gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#9ca3af;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#6b7280;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#9ca3af;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1"/>
    </linearGradient>
    <!-- Gear gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#6b7280;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="140" fill="#1a1a1a" rx="4"/>

  <!-- ══ GEAR (left of OTC) ══ -->
  <g transform="translate(20, 70)" filter="url(#shadow)">
    <!-- Gear teeth -->
    <g fill="url(#gearGrad)" stroke="#374151" stroke-width="0.5">
      <rect x="-4" y="-38" width="8" height="12" rx="1"/>
      <rect x="-4" y="26" width="8" height="12" rx="1"/>
      <rect x="26" y="-4" width="12" height="8" rx="1"/>
      <rect x="-38" y="-4" width="12" height="8" rx="1"/>
      <!-- Diagonal teeth -->
      <rect x="16" y="-34" width="8" height="12" rx="1" transform="rotate(45 20 -28)"/>
      <rect x="16" y="22" width="8" height="12" rx="1" transform="rotate(-45 20 28)"/>
      <rect x="-34" y="-34" width="8" height="12" rx="1" transform="rotate(-45 -30 -28)"/>
      <rect x="-34" y="22" width="8" height="12" rx="1" transform="rotate(45 -30 28)"/>
    </g>
    <!-- Gear body -->
    <circle r="28" fill="url(#diamondPlate)" stroke="#4b5563" stroke-width="1.5"/>
    <circle r="28" fill="url(#metalGrad)" opacity="0.7"/>
    <!-- Hex bolt hole -->
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="#111111" stroke="#6b7280" stroke-width="1"/>
    <!-- Inner circle ring -->
    <circle r="28" fill="none" stroke="#9ca3af" stroke-width="1" opacity="0.4"/>
    <circle r="20" fill="none" stroke="#6b7280" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- ══ OTC LETTERS ══ -->
  <!-- "O" with diamond plate -->
  <g transform="translate(62, 25)" filter="url(#shadow)">
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="url(#diamondPlate)" letter-spacing="-2">O</text>
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="url(#metalGrad)" opacity="0.8" letter-spacing="-2">O</text>
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="none" stroke="#d1d5db" stroke-width="1.5" opacity="0.6" letter-spacing="-2">O</text>
  </g>

  <!-- Wrench/bolt through middle -->
  <g transform="translate(90, 68) rotate(-15)" filter="url(#shadow)">
    <rect x="-4" y="-36" width="8" height="72" rx="3" fill="url(#metalGrad)" stroke="#374151" stroke-width="0.5"/>
    <circle cx="0" cy="-30" r="9" fill="url(#gearGrad)" stroke="#374151" stroke-width="0.5"/>
    <circle cx="0" cy="30" r="9" fill="url(#gearGrad)" stroke="#374151" stroke-width="0.5"/>
    <polygon points="0,-26 6,-20 0,-14 -6,-20" fill="#111111"/>
  </g>

  <!-- "T" -->
  <g transform="translate(118, 25)" filter="url(#shadow)">
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="url(#diamondPlate)" letter-spacing="-2">T</text>
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="url(#metalGrad)" opacity="0.8" letter-spacing="-2">T</text>
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="none" stroke="#d1d5db" stroke-width="1.5" opacity="0.6" letter-spacing="-2">T</text>
  </g>

  <!-- "C" -->
  <g transform="translate(162, 25)" filter="url(#shadow)">
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="url(#diamondPlate)" letter-spacing="-2">C</text>
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="url(#metalGrad)" opacity="0.8" letter-spacing="-2">C</text>
    <text font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="900" fill="none" stroke="#d1d5db" stroke-width="1.5" opacity="0.6" letter-spacing="-2">C</text>
  </g>

  <!-- White outline around OTC -->
  <rect x="58" y="22" width="155" height="96" rx="2" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>

  <!-- Divider line -->
  <line x1="228" y1="25" x2="228" y2="115" stroke="#FFD400" stroke-width="1" opacity="0.4"/>

  <!-- ══ FLEET text ══ -->
  <text x="238" y="82" font-family="Impact, Arial Black, 'Arial Narrow', sans-serif" font-size="66" font-weight="900" fill="#FFD400" letter-spacing="2">FLEET</text>

  <!-- ══ SERVICES text ══ -->
  <text x="240" y="112" font-family="'Arial Narrow', Arial, sans-serif" font-size="28" font-weight="700" fill="white" letter-spacing="4">SERVICES</text>
</svg>
