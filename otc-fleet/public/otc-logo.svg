<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80" style="overflow:visible">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="40%" stop-color="#9ca3af"/>
      <stop offset="60%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <pattern id="plate" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#6b7280"/>
      <path d="M0 3 L3 0 L6 3 L3 6 Z" fill="#9ca3af" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Gear icon -->
  <g transform="translate(34,40)">
    <!-- Gear teeth -->
    <rect x="-4" y="-30" width="8" height="9" rx="1" fill="url(#metal)"/>
    <rect x="-4" y="21" width="8" height="9" rx="1" fill="url(#metal)"/>
    <rect x="21" y="-4" width="9" height="8" rx="1" fill="url(#metal)"/>
    <rect x="-30" y="-4" width="9" height="8" rx="1" fill="url(#metal)"/>
    <rect x="12" y="-27" width="8" height="9" rx="1" fill="url(#metal)" transform="rotate(45,16,-22)"/>
    <rect x="12" y="18" width="8" height="9" rx="1" fill="url(#metal)" transform="rotate(-45,16,22)"/>
    <rect x="-27" y="-27" width="8" height="9" rx="1" fill="url(#metal)" transform="rotate(-45,-23,-22)"/>
    <rect x="-27" y="18" width="8" height="9" rx="1" fill="url(#metal)" transform="rotate(45,-23,22)"/>
    <!-- Gear body -->
    <circle r="22" fill="url(#plate)"/>
    <circle r="22" fill="url(#metal)" opacity="0.6"/>
    <circle r="22" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <!-- Bolt hole -->
    <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="#111111" stroke="#6b7280" stroke-width="0.8"/>
  </g>

  <!-- White border box around OTC -->
  <rect x="60" y="8" width="118" height="64" rx="2" fill="none" stroke="white" stroke-width="2"/>

  <!-- OTC letters -->
  <text x="71" y="66" font-family="Impact,'Arial Narrow',Arial,sans-serif" font-size="62" font-weight="900" fill="url(#plate)" letter-spacing="-2">OTC</text>
  <text x="71" y="66" font-family="Impact,'Arial Narrow',Arial,sans-serif" font-size="62" font-weight="900" fill="url(#metal)" opacity="0.75" letter-spacing="-2">OTC</text>
  <text x="71" y="66" font-family="Impact,'Arial Narrow',Arial,sans-serif" font-size="62" font-weight="900" fill="none" stroke="white" stroke-width="1" opacity="0.5" letter-spacing="-2">OTC</text>

  <!-- Divider -->
  <line x1="188" y1="14" x2="188" y2="66" stroke="#FFD400" stroke-width="1" opacity="0.5"/>

  <!-- FLEET -->
  <text x="196" y="55" font-family="Impact,'Arial Narrow',Arial,sans-serif" font-size="50" font-weight="900" fill="#FFD400" letter-spacing="1">FLEET</text>

  <!-- SERVICES -->
  <text x="198" y="72" font-family="'Arial Narrow',Arial,sans-serif" font-size="20" font-weight="700" fill="white" letter-spacing="5">SERVICES</text>
</svg>
